_schema-version: 3.3.0

ID: BTP_CAPM
version: 1.0.2

description: "A CAP project developed by dhaya."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production


modules:

  # ============================================================
  # CAP SERVICE
  # ============================================================
  - name: BTP_CAPM-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: BTP_CAPM-db
      - name: BTP_CAPM-auth


  # ============================================================
  # HANA DB DEPLOYER
  # ============================================================
  - name: BTP_CAPM-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: BTP_CAPM-db


  # ============================================================
  # APPLICATION ROUTER
  # ============================================================
  - name: BTP_CAPM-UI
    type: approuter.nodejs
    path: app

    parameters:
      instances: 1
      memory: 256M
      disk-quota: 256M
      keep-existing-routes: true

    build-parameters:
      builder: npm-ci

    requires:

      - name: srv-api
        group: destinations
        properties:
          name: dhaya-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: true

      - name: BTP_CAPM-auth


resources:

  # ============================================================
  # HANA HDI CONTAINER
  # ============================================================
  - name: BTP_CAPM-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared


  # ============================================================
  # XSUAA
  # ============================================================
  - name: BTP_CAPM-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

      config:
        xsappname: BTP_CAPM-${org}-${space}
        tenant-mode: dedicated